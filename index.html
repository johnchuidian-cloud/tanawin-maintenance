<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9A3518">
  <meta name="robots" content="noindex, nofollow">
  <title>Tanawin Maintenance</title>
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- ============ Login: pick your name, enter your 4-digit PIN ============ -->
  <div id="login" class="gate hidden">
    <img class="gate-logo" src="assets/tanawin-icon.jpg" alt="Tanawin" width="76" height="76">
    <div class="logo-mark gate-word">Tanaw<span class="logo-i">&#305;<span class="flower">&#10040;</span></span>n</div>
    <p class="gate-sub">Maintenance</p>
    <div id="loginPicker" class="picker"></div>
    <div id="loginPinWrap" class="hidden">
      <p class="welcome" id="loginWho"></p>
      <p class="welcome-sub">Enter your 4-digit PIN</p>
      <input id="loginPin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" placeholder="• • • •" aria-label="Your PIN">
      <p><button id="pickSomeoneElse" class="linklike">← Pick someone else</button></p>
    </div>
    <p id="loginError" class="gate-error hidden"></p>
    <p class="gate-hint">Staff only. Repairs, equipment and scheduled upkeep for the property.</p>
  </div>

  <!-- ============ App ============ -->
  <div id="app" class="wrap hidden">
    <header class="topbar"><div class="topbar-row">
      <div class="brand">Tanawin <span>Maintenance</span></div>
      <div class="topbar-right">
        <a class="hubchip" id="hub" href="#" title="Tanawin Hub" aria-label="Tanawin Hub">&#8962; Hub</a>
        <button class="who" id="who" title="You"></button>
        <button class="bell" id="bell" title="Alerts" aria-label="Alerts">🔔<span class="bdot" id="bdot"></span></button>
        <button class="gear hidden" id="gear" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </div></header>
    <main id="page" class="app"></main>
    <nav class="nav" id="nav"></nav>
  </div>

  <div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
  <div class="lightbox" id="lightbox"></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/views.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/app.js"></script>
  <script src="js/update-check.js"></script>
</body>
</html>
